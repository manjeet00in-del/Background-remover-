<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PVC Auto Crop - Manjeet Digital Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e9eff6;color:#172033}
button,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dbe4ef;padding:10px}
.topbar{max-width:920px;margin:auto;display:grid;grid-template-columns:48px 48px 1fr 70px;gap:7px;align-items:center}
.top button,.title{height:44px;border:1px solid #d7e2ef;border-radius:14px;background:#f8fbff;font-weight:800}.trash{color:#e11d48}.title{display:grid;place-items:center;background:#2563eb;color:#fff;border-color:#2563eb;border-radius:11px}.page{display:grid;place-items:center;color:#475569}
.workspace{max-width:920px;margin:auto;background:#fff;min-height:64vh;padding:14px 12px 8px}
.preview{position:relative;min-height:420px;height:58vh;max-height:650px;display:flex;align-items:flex-start;justify-content:center;padding:18px 8px 74px;background:#fff;overflow:hidden;touch-action:none}
.preview canvas#src{max-width:90%;max-height:45vh;display:none;box-shadow:0 8px 28px rgba(15,23,42,.13)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.empty{position:absolute;inset:0 0 64px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#94a3b8;text-align:center}.empty b{color:#475569;font-size:17px;margin:7px}.empty span{font-size:38px}
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:7px;align-items:center;background:#f8fafc;padding:6px;border-radius:999px;box-shadow:0 5px 16px rgba(15,23,42,.1)}
.circle{width:45px;height:45px;border-radius:50%;border:2px solid #bfdbfe;background:#fff;font-size:18px;font-weight:800;box-shadow:0 3px 8px rgba(15,23,42,.08)}.circle.crop{background:#10b981;color:#fff}.circle.magic{background:#a855f7;color:#fff}.circle.border{background:#0891b2;color:#fff}.circle.rotate{background:#3b82f6;color:#fff}
.single{max-width:920px;margin:auto;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#64748b}
.switch{width:45px;height:25px;border-radius:20px;background:#e2e8f0;padding:3px}.switch:after{content:"";display:block;width:19px;height:19px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #64748b66}
.bottom{position:sticky;bottom:0;z-index:15;background:#fff;border-top:1px solid #dbe4ef;padding:10px 12px 12px}.bottomin{max-width:920px;margin:auto;display:grid;grid-template-columns:1.5fr repeat(4,58px);gap:9px;align-items:center}
.upload{height:52px;border:0;background:#fff;color:#64748b;font-weight:800;text-align:left}.upload strong{color:#2563eb}.upload input{display:none}
.action{height:52px;width:52px;border-radius:50%;border:1px solid #dbe4ef;background:#fff;font-size:17px;font-weight:800;box-shadow:0 4px 11px rgba(15,23,42,.09)}.action.jpg{color:#2563eb}.action.pdf{color:#ef4444}.action.png{color:#16a34a}.action.print{background:#2563eb;color:#fff}
.hint{text-align:center;color:#94a3b8;font-size:10px;margin-top:6px}
.panel{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);align-items:flex-end;justify-content:center}.panel.show{display:flex}.sheet{width:min(600px,100%);background:#fff;border-radius:22px 22px 0 0;padding:17px;max-height:80vh;overflow:auto}.sheet h3{margin:0 0 5px}.sheet p{font-size:11px;color:#64748b;margin:0 0 13px}.preset{display:flex;gap:7px;margin-bottom:13px}.preset button,.done{flex:1;border:1px solid #dbe4ef;border-radius:10px;background:#f8fafc;padding:10px;font-weight:800}.done{background:#2563eb;color:#fff;border:0;width:100%}.range{margin:12px 0}.range label{font-size:11px;font-weight:800;display:flex;justify-content:space-between}.range input{width:100%}
.borderrow{display:flex;gap:9px;align-items:center;margin:12px 0}.borderrow input[type=color]{width:50px;height:38px}
@media(max-width:480px){.workspace{padding:10px 8px 5px}.preview{height:55vh;min-height:390px;padding-top:12px}.preview canvas#src{max-width:88%;max-height:41vh}.tools{gap:5px}.circle{width:42px;height:42px}.bottomin{grid-template-columns:1.5fr repeat(4,50px);gap:6px}.action{width:48px;height:48px;font-size:15px}.topbar{grid-template-columns:44px 44px 1fr 62px}}
</style>
</head>
<body>
<div class="top"><div class="topbar">
<button onclick="location.href='../index.html'">⌂</button><button class="trash" onclick="resetAll()">🗑</button>
<div class="title">PVC</div><button class="page">▱ P1</button>
</div></div>

<div class="workspace">
<div class="preview" id="preview">
<div class="empty" id="empty"><span>🪪</span><b>No card selected</b><small>Select JPG, PNG or PDF below</small></div>
<canvas id="src"></canvas><canvas id="ov"></canvas>
<div class="tools" id="toolbar" style="display:none">
<button class="circle crop" title="Re-Crop" onclick="openCrop()">⌗</button>
<button class="circle rotate" title="Rotate" onclick="rotate()">↻</button>
<button class="circle" title="Card Ratio" onclick="fitRatio()">↔</button>
<button class="circle magic" title="Enhance" onclick="openEnhance()">✣</button>
<button class="circle border" title="Border" onclick="openBorder()">□</button>
<button class="circle" title="Use Crop" onclick="confirmCrop()">✓</button>
</div>
</div>
</div>

<div class="single"><span>Single Side Mode?</span><div class="switch"></div></div>

<div class="bottom"><div class="bottomin">
<label class="upload">📷 &nbsp;<strong>SELECT FILE</strong><input id="file" type="file" accept="image/*,application/pdf"></label>
<button class="action jpg" onclick="saveJPG()">↓<small style="display:block;font-size:7px">JPG</small></button>
<button class="action pdf" onclick="savePDF()">▣<small style="display:block;font-size:7px">PDF</small></button>
<button class="action png" onclick="savePNG()">▧<small style="display:block;font-size:7px">PNG</small></button>
<button class="action print" onclick="doPrint()">▣<small style="display:block;font-size:7px">PRINT</small></button>
</div><div class="hint" id="hint">PVC Auto Crop Preview Mode</div></div>

<div class="panel" id="cropPanel"><div class="sheet"><h3>Re-Crop Assistant</h3><p>Auto Crop ke 4 corner dots lagenge. Done se pehle manually adjust kar sakte hain.</p>
<div class="preset"><button onclick="autoCrop()">AUTO CROP</button><button onclick="fitRatio()">PVC RATIO</button><button onclick="closePanels()">CANCEL</button></div>
<button class="done" onclick="closePanels()">DONE</button></div></div>

<div class="panel" id="enhancePanel"><div class="sheet"><h3>Adjust Scan</h3><p>Crop, color aur print clarity.</p>
<div class="preset"><button onclick="preset('orig')">ORIG</button><button onclick="preset('natural')">NATURAL</button><button onclick="preset('bw')">B&amp;W</button></div>
<div class="range"><label>Brightness <span id="bv">0</span></label><input id="bright" type="range" min="-50" max="50" value="0" oninput="applyFilters()"></div>
<div class="range"><label>Contrast <span id="cv">0</span></label><input id="contrast" type="range" min="-50" max="50" value="0" oninput="applyFilters()"></div>
<div class="range"><label>Saturation <span id="sv">0</span></label><input id="sat" type="range" min="-50" max="50" value="0" oninput="applyFilters()"></div>
<button class="done" onclick="closePanels()">CONFIRM SCAN</button></div></div>

<div class="panel" id="borderPanel"><div class="sheet"><h3>PVC Card Border</h3><p>Selected card par optional border.</p>
<div class="borderrow"><label><input id="borderOn" type="checkbox" onchange="renderFinal()"> Enable Border</label><input id="borderColor" type="color" value="#000000" onchange="renderFinal()"></div>
<div class="range"><label>Thickness <span id="tv">6 px</span></label><input id="thick" type="range" min="1" max="20" value="6" oninput="tv.textContent=this.value+' px';renderFinal()"></div>
<button class="done" onclick="closePanels()">APPLY BORDER</button></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const file=document.getElementById("file"),src=document.getElementById("src"),ctx=src.getContext("2d"),ov=document.getElementById("ov"),ox=ov.getContext("2d"),preview=document.getElementById("preview");
let original=null,rotation=0,pts=[],drag=-1,cropped=null,baseCrop=null;
file.onchange=e=>loadFile(e.target.files[0]);
async function loadFile(f){if(!f)return;hint.textContent="Loading...";if(f.type==="application/pdf"){let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,page=await pdf.getPage(1),v=page.getViewport({scale:2}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise;loadURL(c.toDataURL("image/jpeg",.96))}else{let r=new FileReader;r.onload=()=>loadURL(r.result);r.readAsDataURL(f)}}
function loadURL(u){let im=new Image;im.onload=()=>{original=im;rotation=0;drawOriginal();empty.style.display="none";src.style.display="block";toolbar.style.display="flex";setTimeout(()=>{autoCrop();hint.textContent="Auto crop ready • corners manually adjust kar sakte hain"},80)};im.src=u}
function drawOriginal(){let w=original.width,h=original.height;if(rotation%180)[w,h]=[h,w];let sc=Math.min(1,1800/Math.max(w,h));src.width=Math.round(w*sc);src.height=Math.round(h*sc);ctx.save();ctx.clearRect(0,0,src.width,src.height);ctx.translate(src.width/2,src.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(original,-original.width*sc/2,-original.height*sc/2,original.width*sc,original.height*sc);ctx.restore();sizeOverlay()}
function sizeOverlay(){ov.width=preview.clientWidth;ov.height=preview.clientHeight}
function box(){let a=src.getBoundingClientRect(),b=preview.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
function defaultPts(){let b=box(),m=Math.min(12,b.w*.03);pts=[[b.x+m,b.y+m],[b.x+b.w-m,b.y+m],[b.x+b.w-m,b.y+b.h-m],[b.x+m,b.y+b.h-m]];paint()}
function paint(){sizeOverlay();ox.clearRect(0,0,ov.width,ov.height);if(!pts.length)return;ox.fillStyle="rgba(15,23,42,.28)";ox.fillRect(0,0,ov.width,ov.height);ox.save();ox.globalCompositeOperation="destination-out";ox.beginPath();ox.moveTo(...pts[0]);pts.slice(1).forEach(p=>ox.lineTo(...p));ox.closePath();ox.fill();ox.restore();ox.strokeStyle="#06b6d4";ox.setLineDash([7,5]);ox.lineWidth=3;ox.beginPath();ox.moveTo(...pts[0]);pts.slice(1).forEach(p=>ox.lineTo(...p));ox.closePath();ox.stroke();ox.setLineDash([]);pts.forEach(p=>{ox.beginPath();ox.arc(p[0],p[1],9,0,7);ox.fillStyle="#fff";ox.fill();ox.lineWidth=4;ox.strokeStyle="#06b6d4";ox.stroke()})}
function autoCrop(){if(!original)return;let b=box(),D=ctx.getImageData(0,0,src.width,src.height).data,w=src.width,h=src.height,cs=[[2,2],[w-3,2],[2,h-3],[w-3,h-3]].map(q=>{let i=(q[1]*w+q[0])*4;return[D[i],D[i+1],D[i+2]]}),bg=[0,1,2].map(k=>cs.reduce((a,c)=>a+c[k],0)/4),mnx=w,mny=h,mxx=0,mxy=0,n=0,st=Math.max(1,Math.floor(Math.max(w,h)/700));for(let y=0;y<h;y+=st)for(let x=0;x<w;x+=st){let i=(y*w+x)*4,z=Math.abs(D[i]-bg[0])+Math.abs(D[i+1]-bg[1])+Math.abs(D[i+2]-bg[2]);if(z>75){mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);n++}}if(n<30){defaultPts();hint.textContent="Edge clear nahi mila • dots manually adjust karein";return}let sx=b.w/w,sy=b.h/h;pts=[[b.x+mnx*sx,b.y+mny*sy],[b.x+mxx*sx,b.y+mny*sy],[b.x+mxx*sx,b.y+mxy*sy],[b.x+mnx*sx,b.y+mxy*sy]];paint()}
function fitRatio(){if(!original)return;let b=box(),r=85.6/54,W=b.w*.9,H=W/r;if(H>b.h*.9){H=b.h*.9;W=H*r}let x=b.x+b.w/2,y=b.y+b.h/2;pts=[[x-W/2,y-H/2],[x+W/2,y-H/2],[x+W/2,y+H/2],[x-W/2,y+H/2]];paint()}
function xy(e){let r=preview.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}function down(e){if(!pts.length)return;let p=xy(e),best=99;drag=-1;pts.forEach((q,i)=>{let d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<35&&d<best){best=d;drag=i}});if(drag>=0)e.preventDefault()}function move(e){if(drag<0)return;e.preventDefault();let p=xy(e),b=box();pts[drag]=[Math.max(b.x,Math.min(b.x+b.w,p[0])),Math.max(b.y,Math.min(b.y+b.h,p[1]))];paint()}function up(){drag=-1}
preview.addEventListener("touchstart",down,{passive:false});preview.addEventListener("touchmove",move,{passive:false});preview.addEventListener("touchend",up);preview.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
function rotate(){if(!original)return;rotation=(rotation+90)%360;drawOriginal();setTimeout(autoCrop,30)}
function cropCanvas(){let b=box(),sx=src.width/b.w,sy=src.height/b.h,p=pts.map(q=>[(q[0]-b.x)*sx,(q[1]-b.y)*sy]),x=Math.max(0,Math.min(...p.map(q=>q[0]))),X=Math.min(src.width,Math.max(...p.map(q=>q[0]))),y=Math.max(0,Math.min(...p.map(q=>q[1]))),Y=Math.min(src.height,Math.max(...p.map(q=>q[1]))),W=Math.max(1,X-x),H=Math.max(1,Y-y),land=W>=H,c=document.createElement("canvas");c.width=land?1011:638;c.height=land?638:1011;c.getContext("2d").drawImage(src,x,y,W,H,0,0,c.width,c.height);return c}
function confirmCrop(){if(!original)return;cropped=cropCanvas();baseCrop=document.createElement("canvas");baseCrop.width=cropped.width;baseCrop.height=cropped.height;baseCrop.getContext("2d").drawImage(cropped,0,0);renderFinal();hint.textContent="PVC crop confirmed • export ready"}
function renderFinal(){if(!baseCrop)return;cropped=document.createElement("canvas");cropped.width=baseCrop.width;cropped.height=baseCrop.height;let x=cropped.getContext("2d");x.filter=`brightness(${100+(+bright.value)}%) contrast(${100+(+contrast.value)}%) saturate(${100+(+sat.value)}%)`;x.drawImage(baseCrop,0,0);x.filter="none";if(borderOn.checked){x.strokeStyle=borderColor.value;x.lineWidth=+thick.value;x.strokeRect(x.lineWidth/2,x.lineWidth/2,cropped.width-x.lineWidth,cropped.height-x.lineWidth)}ctx.clearRect(0,0,src.width,src.height);src.width=cropped.width;src.height=cropped.height;ctx.drawImage(cropped,0,0);pts=[];paint()}
function applyFilters(){bv.textContent=bright.value;cv.textContent=contrast.value;sv.textContent=sat.value;if(!baseCrop)confirmCrop();else renderFinal()}
function preset(t){if(t==="orig"){bright.value=contrast.value=sat.value=0}else if(t==="natural"){bright.value=5;contrast.value=7;sat.value=5}else{bright.value=3;contrast.value=20;sat.value=-50}applyFilters()}
function openCrop(){document.getElementById("cropPanel").classList.add("show");if(!pts.length){drawOriginal();setTimeout(autoCrop,30)}}function openEnhance(){if(!baseCrop)confirmCrop();enhancePanel.classList.add("show")}function openBorder(){if(!baseCrop)confirmCrop();borderPanel.classList.add("show")}function closePanels(){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"))}
function ensure(){if(!original)return false;if(!cropped)confirmCrop();return true}
function saveJPG(){if(!ensure())return;let a=document.createElement("a");a.href=cropped.toDataURL("image/jpeg",.96);a.download="pvc-card.jpg";a.click()}
function savePNG(){if(!ensure())return;let a=document.createElement("a");a.href=cropped.toDataURL("image/png");a.download="pvc-card.png";a.click()}
function savePDF(){if(!ensure())return;let {jsPDF}=window.jspdf,p=new jsPDF({unit:"mm",format:"a4"}),land=cropped.width>=cropped.height,w=land?85.6:54,h=land?54:85.6;p.addImage(cropped.toDataURL("image/jpeg",.96),"JPEG",(210-w)/2,25,w,h);p.save("pvc-card.pdf")}
function doPrint(){if(!ensure())return;let u=cropped.toDataURL("image/png"),w=window.open("","_blank");w.document.write('<style>@page{size:A4;margin:15mm}body{text-align:center}img{width:85.6mm;height:54mm;object-fit:fill}</style><img src="'+u+'"><script>onload=()=>print()<\/script>');w.document.close()}
function resetAll(){original=cropped=baseCrop=null;pts=[];src.width=src.height=1;src.style.display="none";empty.style.display="flex";toolbar.style.display="none";paint();file.value="";hint.textContent="PVC Auto Crop Preview Mode";bright.value=contrast.value=sat.value=0}
window.addEventListener("resize",()=>{if(original&&!cropped){setTimeout(autoCrop,50)}})
</script>
</body></html>
