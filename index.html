<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Photo Enhancer (0 Cost)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #12122a; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c1c3d;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        canvas { 
            max-width: 100%; 
            height: auto; 
            margin-top: 20px; 
            border-radius: 10px; 
            border: 2px solid #333;
            display: none; 
        }
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 25px; 
            display: none; 
        }
        button { 
            font-size: 16px; 
            font-weight: bold; 
            padding: 12px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            transition: 0.3s;
        }
        .btn-lighting { background: #f39c12; }
        .btn-hdr { background: #8e44ad; }
        .btn-enhance { background: #2980b9; }
        .btn-reset { background: #555; }
        .btn-download { background: #27ae60; margin-top: 10px;}
        
        button:hover { opacity: 0.8; }
        .status { color: #00d2ff; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>✨ AI Photo Enhancer</h2>
        <p style="color: #aaa; font-size: 14px;">⚡ GPU Engine Active (WebGL / Canvas)</p>

        <input type="file" id="upload" accept="image/*">
        <div id="status" class="status"></div>
        
        <!-- आउटपुट स्क्रीन -->
        <canvas id="canvas"></canvas>

        <!-- कंट्रोल पैनल -->
        <div class="btn-group" id="controls">
            <button class="btn-lighting" onclick="applyLighting()">✨ Fix Face Lighting & Tone</button>
            <button class="btn-hdr" onclick="applyHDR()">📸 HDR & Vivid Filter</button>
            <button class="btn-enhance" onclick="applyDeepEnhance()">🧠 Deep Enhance (Sharpen Details)</button>
            <button class="btn-reset" onclick="resetImage()">🔄 Reset All</button>
            <button class="btn-download" onclick="downloadImage()">⬇️ Download HD Image</button>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const controls = document.getElementById('controls');
        const statusText = document.getElementById('status');
        
        let originalImage = new Image();

        // इमेज अपलोड हैंडल करना
        uploadInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusText.innerText = "लोड हो रहा है...";
            const url = URL.createObjectURL(file);
            
            originalImage.src = url;
            originalImage.onload = () => {
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                resetImage();
                canvas.style.display = 'block';
                controls.style.display = 'flex';
                statusText.innerText = "✅ फोटो रेडी है! नीचे दिए गए इफ़ेक्ट चुनें।";
            };
        });

        // 1. Fix Lighting (ब्राइटनेस और वार्म टोन)
        function applyLighting() {
            ctx.filter = 'brightness(1.15) contrast(1.1) saturate(1.2) sepia(0.1)';
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; // फ़िल्टर रीसेट
            statusText.innerText = "✨ Lighting Fix Applied!";
        }

        // 2. HDR Effect (कलर बूस्ट और हाई कंट्रास्ट)
        function applyHDR() {
            ctx.filter = 'contrast(1.25) saturate(1.4) brightness(1.05)';
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            statusText.innerText = "📸 HDR Effect Applied!";
        }

        // 3. Deep Enhance (शार्पनेस बढ़ाना - पिक्सेल लेवल प्रोसेसिंग)
        function applyDeepEnhance() {
            statusText.innerText = "⚙️ प्रोसेसिंग... (GPU Active)";
            
            // पहले कलर्स को थोड़ा बूस्ट करें
            ctx.filter = 'contrast(1.1) saturate(1.1)';
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';

            // Convolution Matrix (शार्पनिंग)
            setTimeout(() => {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const width = canvas.width;
                
                // सिंपल शार्पनिंग लॉजिक
                for (let i = 0; i < data.length; i += 4) {
                    if (i % (width * 4) === 0 || i < width * 4) continue; 
                    
                    let r = data[i], g = data[i+1], b = data[i+2];
                    let topR = data[i - width * 4];
                    let leftR = data[i - 4];
                    
                    // पिक्सेल कंट्रास्ट बढ़ाकर डिटेल्स उभारना
                    data[i] = r + (r - (topR + leftR) / 2) * 0.5;
                    data[i+1] = g + (g - (data[i+1 - width*4] + data[i+1 - 4]) / 2) * 0.5;
                    data[i+2] = b + (b - (data[i+2 - width*4] + data[i+2 - 4]) / 2) * 0.5;
                }
                ctx.putImageData(imageData, 0, 0);
                statusText.innerText = "🧠 Deep Enhance Completed!";
            }, 50);
        }

        // इमेज को वापस ओरिजिनल करना
        function resetImage() {
            ctx.filter = 'none';
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            statusText.innerText = "🔄 ओरिजिनल फोटो";
        }

        // फोटो डाउनलोड करना
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'Enhanced_Photo.png';
            link.href = canvas.toDataURL('image/png', 1.0); // 1.0 मतलब फुल क्वालिटी
            link.click();
        }
    </script>
</body>
</html>
