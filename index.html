<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manjeet Digital Hub - BG Remove Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:720px;margin:auto;padding:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0000000d}
h1{font-size:24px;margin:0 0 7px}.sub{font-size:13px;color:#64748b;margin-bottom:18px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:800;font-size:15px}
button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.box{min-height:220px;background:#eef2f7;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.box img{max-width:100%;max-height:360px;object-fit:contain}.label{font-size:12px;font-weight:bold;margin:12px 0 5px}
#status{margin-top:12px;padding:10px;border-radius:9px;background:#f8fafc;font-size:12px;white-space:pre-wrap;word-break:break-word}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}.box{min-height:180px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>✨ BG Remove Test</h1>
<div class="sub">Manjeet Digital Hub — pehle sirf AI background removal test karein.</div>
<input id="file" type="file" accept="image/*">
<button id="remove" disabled>Remove Background</button>
<div id="status">1. Photo select karein.</div>
<div class="grid">
<div><div class="label">Original</div><div class="box"><img id="before"></div></div>
<div><div class="label">Result</div><div class="box checker"><img id="after"></div></div>
</div>
</div></div>
<script type="module">
const file=document.querySelector('#file'),btn=document.querySelector('#remove');
const before=document.querySelector('#before'),after=document.querySelector('#after'),status=document.querySelector('#status');
let source=null;
const say=x=>status.textContent=x;

file.onchange=()=>{
 const f=file.files?.[0]; if(!f)return;
 if(source)URL.revokeObjectURL(source);
 source=URL.createObjectURL(f); before.src=source; after.removeAttribute('src');
 btn.disabled=false; say('Photo ready. Ab Remove Background dabayein.');
};

btn.onclick=async()=>{
 if(!file.files?.[0])return;
 btn.disabled=true;
 try{
   say('Step 1/3: Transformers.js load ho raha hai…');
   const t=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.3');
   t.env.allowLocalModels=false;
   t.env.useBrowserCache=true;

   say('Step 2/3: AI model load/download ho raha hai…\nFirst time thoda time lag sakta hai.');
   // Use the standard Transformers.js background-removal pipeline without forcing WebGPU.
   // This intentionally lets the library use its browser-compatible default backend.
   const pipe=await t.pipeline('background-removal','Xenova/modnet');

   say('Step 3/3: Photo process ho rahi hai…');
   const result=await pipe(source);
   if(!result || !result[0]) throw new Error('AI returned no image result.');

   const canvas=result[0].toCanvas();
   after.src=canvas.toDataURL('image/png');
   say('✓ SUCCESS\nBackground removal browser ke andar chal gaya.');
 }catch(e){
   console.error(e);
   say('❌ ERROR\n'+(e?.name||'Error')+': '+(e?.message||String(e))+
       '\n\nIs poore error ka screenshot bhejein.');
 }finally{btn.disabled=false}
};
</script></body></html>
