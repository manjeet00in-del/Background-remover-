<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Editable Template</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f7;color:#172033}header{background:#0f172a;color:white;padding:17px;font-size:20px;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:15px}.card{background:white;padding:15px;border-radius:15px;margin-bottom:14px;box-shadow:0 5px 20px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}button,.up{background:#2563eb;color:white;border:0;padding:11px 13px;border-radius:9px;font-weight:bold;cursor:pointer}button.alt{background:#e2e8f0;color:#111827}input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr 260px;gap:14px}.work{overflow:auto;background:#cbd5e1;padding:15px;border-radius:12px;min-height:500px}#canvas{position:relative;margin:auto;background:white center/100% 100% no-repeat;box-shadow:0 4px 20px #0003}.item{position:absolute;cursor:move;white-space:pre;border:1px dashed transparent;padding:1px 2px}.item.active,.item:hover{border-color:#2563eb;background:#eff6ffbb}.side label{display:block;font-size:12px;font-weight:bold;margin:10px 0 4px}.side input{width:100%;padding:8px}.status{font-size:13px;color:#64748b;margin-top:9px}.bar{height:6px;background:#e2e8f0;margin-top:10px;border-radius:10px;overflow:hidden}#prog{height:100%;width:0;background:#2563eb}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}}
</style></head><body><header>AI Image → Editable Template · Demo</header><div class="wrap"><div class="card"><div class="row"><label class="up">① Upload Image<input id="file" type="file" accept="image/*"></label><button id="scan">② Analyze & Convert</button><button class="alt" id="add">+ Text</button><button class="alt" id="bg">Background On/Off</button></div><div class="bar"><div id="prog"></div></div><div class="status" id="status">Image upload करें और Analyze दबाएँ।</div></div><div class="grid"><div class="work"><div id="canvas"></div></div><div class="card side"><b>Selected Element</b><label>Text</label><input id="txt"><label>Font size</label><input id="fs" type="number" value="20"><label>Color</label><input id="col" type="color" value="#111111"><button id="del" style="background:#dc2626;width:100%;margin-top:14px">Delete</button><p class="status">OCR text को image की approximate original position पर editable layers में बनाएगा। Text को drag, edit और resize कर सकते हैं।</p><p class="status">यह standalone proof-of-concept है; Manjeet Digital Hub में कोई बदलाव नहीं करता।</p></div></div></div><script>
const q=x=>document.getElementById(x),c=q('canvas');let data=null,sel=null,bgon=true;
function pick(e){document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));sel=e;if(e){e.classList.add('active');q('txt').value=e.innerText;q('fs').value=parseInt(getComputedStyle(e).fontSize)}}
function drag(e){let on=0,sx,sy,l,t;e.onpointerdown=a=>{pick(e);on=1;sx=a.clientX;sy=a.clientY;l=e.offsetLeft;t=e.offsetTop;e.setPointerCapture(a.pointerId)};e.onpointermove=a=>{if(on){e.style.left=Math.max(0,l+a.clientX-sx)+'px';e.style.top=Math.max(0,t+a.clientY-sy)+'px'}};e.onpointerup=()=>on=0}
function text(v='Editable Text',x=20,y=20,s=20){let e=document.createElement('div');e.className='item';e.contentEditable=true;e.innerText=v;e.style.cssText=`left:${x}px;top:${y}px;font-size:${s}px`;c.appendChild(e);drag(e);return e}
q('file').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>{data=r.result;let i=new Image();i.onload=()=>{let sc=Math.min(1,900/i.width);c.dataset.sc=sc;c.style.width=i.width*sc+'px';c.style.height=i.height*sc+'px';c.style.backgroundImage=`url("${data}")`;c.innerHTML='';q('status').innerText='Image loaded. अब Analyze दबाएँ।'};i.src=data};r.readAsDataURL(f)};
q('scan').onclick=async()=>{if(!data)return alert('पहले image upload करें');c.innerHTML='';try{let r=await Tesseract.recognize(data,'eng',{logger:m=>{if(m.status==='recognizing text'){let p=Math.round(m.progress*100);q('prog').style.width=p+'%';q('status').innerText='Analyzing… '+p+'%'}}}),sc=+c.dataset.sc||1,n=0;(r.data.words||[]).filter(w=>w.text&&w.text.trim()&&(w.confidence??w.conf??0)>35).forEach(w=>{let b=w.bbox,s=Math.max(9,Math.round((b.y1-b.y0)*sc*.8));text(w.text.trim(),b.x0*sc,b.y0*sc,s);n++});pick(null);q('status').innerText=`Done — ${n} editable text elements मिले।`;q('prog').style.width='100%'}catch(e){q('status').innerText='OCR load नहीं हुआ। Internet check करके फिर try करें।'}};
q('add').onclick=()=>pick(text());q('bg').onclick=()=>{bgon=!bgon;c.style.backgroundImage=bgon&&data?`url("${data}")`:'none'};q('txt').oninput=()=>{if(sel)sel.innerText=q('txt').value};q('fs').oninput=()=>{if(sel)sel.style.fontSize=q('fs').value+'px'};q('col').oninput=()=>{if(sel)sel.style.color=q('col').value};q('del').onclick=()=>{if(sel){sel.remove();sel=null}};
</script></body></html>
