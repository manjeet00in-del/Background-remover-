<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Smart Application Writer V1</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7ff;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 8px 24px #2563eb12}h1{font-size:23px;margin:0 0 5px}.sub{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:8px 0}.field label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dbe3ef;border-radius:9px;font:inherit;font-size:13px}.field textarea{min-height:92px;resize:vertical}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:#edf4ff;color:#1d4ed8}.primary{background:#2563eb;color:#fff}.green{background:#059669;color:#fff}.paper{background:#fff;border:1px solid #cbd5e1;min-height:520px;padding:34px;white-space:pre-wrap;line-height:1.65;font-family:Georgia,'Times New Roman',serif;font-size:15px;outline:none}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer}.note{font-size:10px;color:#64748b;background:#f8fafc;padding:9px;border-radius:9px}@media(max-width:650px){.grid{grid-template-columns:1fr}.paper{padding:20px;min-height:450px}.wrap{padding:9px}}@media print{body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;box-shadow:none;margin:0;padding:0}.paper{border:0;padding:18mm;font-size:14pt;min-height:0}}</style></head><body><div class="wrap"><div class="card no-print"><h1>✨ Smart Application Writer</h1><div class="sub">API-free smart application generator • Hindi + English • Works in browser</div><div class="field"><label>Bas apni requirement likhiye</label><textarea id="prompt" placeholder="Example: office leave 3 din family function ke liye&#10;Example: bank me mobile number change karna hai&#10;Example: police complaint for lost mobile"></textarea></div><div class="chips"><button class="chip" data-p="office leave 3 din family function ke liye">Office Leave</button><button class="chip" data-p="school leave due to fever">School Leave</button><button class="chip" data-p="bank account me mobile number change">Bank Mobile Update</button><button class="chip" data-p="bank cheque book request">Cheque Book</button><button class="chip" data-p="lost mobile police complaint">Police Complaint</button><button class="chip" data-p="electricity complaint">Electricity Complaint</button></div><div class="grid"><div class="field"><label>Language</label><select id="lang"><option value="auto">Auto Detect</option><option value="en">English</option><option value="hi">Hindi</option></select></div><div class="field"><label>Style</label><select id="tone"><option value="formal">Formal</option><option value="simple">Simple</option></select></div><div class="field"><label>Your Name</label><input id="name" placeholder="Optional"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>To / Department</label><input id="to" placeholder="Auto if blank"></div><div class="field"><label>Place / Organization</label><input id="place" placeholder="Optional"></div></div><div class="btns"><button id="generate" class="btn primary">✨ Create Application</button><button id="clear" class="btn">Clear</button></div><div class="note" style="margin-top:10px">This is a browser-side smart template/rule engine. It does not send your text to an AI API or server.</div></div><div class="card" id="resultCard" style="display:none"><div class="no-print btns" style="margin-bottom:10px"><button id="copy" class="btn">📋 Copy</button><button id="print" class="btn green">🖨 Print / Save PDF</button><button id="regen" class="btn">↻ Regenerate</button></div><div id="paper" class="paper" contenteditable="true"></div></div></div><script>(function(){var $=function(i){return document.getElementById(i)};var d=new Date(),iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');$('date').value=iso;document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){$('prompt').value=this.getAttribute('data-p')}});function hasHindi(s){return /[\u0900-\u097F]/.test(s)}function detect(s){s=s.toLowerCase();if(/office|leave|chhutti|छुट्टी|अवकाश/.test(s)&&/office|company|job|manager|ऑफिस|कार्यालय/.test(s))return'office';if(/school|college|विद्यालय|स्कूल|कॉलेज/.test(s)&&/leave|chhutti|छुट्टी|अवकाश/.test(s))return'school';if(/mobile|phone/.test(s)&&/bank|account|बैंक|खाता/.test(s)&&/change|update|badal|बदल|अपडेट/.test(s))return'bankmobile';if(/cheque|check book|चेक/.test(s))return'cheque';if(/atm|debit/.test(s))return'atm';if(/close|closure|band|बंद/.test(s)&&/bank|account|बैंक|खाता/.test(s))return'bankclose';if(/bank|account|बैंक|खाता/.test(s)&&/open|opening|khul|खोल/.test(s))return'bankopen';if(/police|fir|complaint|lost|stolen|चोरी|खो|पुलिस|शिकायत/.test(s))return'police';if(/electric|bijli|बिजली/.test(s))return'electric';if(/water|pani|पानी/.test(s))return'water';return'general'}function days(s){var m=s.match(/(\d+)\s*(day|days|din|दिन)/i);return m?m[1]:''}function reason(s){if(/family function|शादी|function/i.test(s))return['a family function','पारिवारिक कार्यक्रम'];if(/fever|बुखार|sick|ill|बीमार/i.test(s))return['health reasons','स्वास्थ्य संबंधी कारणों'];if(/personal|personal work|व्यक्तिगत/i.test(s))return['personal reasons','व्यक्तिगत कारणों'];return['personal reasons','व्यक्तिगत कारणों']}function fmtDate(v,hi){if(!v)return'';var a=v.split('-');return hi?a[2]+'/'+a[1]+'/'+a[0]:a[2]+'/'+a[1]+'/'+a[0]}function build(){var p=$('prompt').value.trim();if(!p){alert('Please write your requirement first.');return}var hi=$('lang').value==='hi'||($('lang').value==='auto'&&hasHindi(p)),type=detect(p),n=$('name').value.trim()||(hi?'नाम: __________':'Name: __________'),pl=$('place').value.trim(),dt=fmtDate($('date').value,hi),customTo=$('to').value.trim(),dy=days(p),rs=reason(p),to='',sub='',body='';if(hi){if(type==='office'){to=customTo||'सेवा में,\nप्रबंधक महोदय/महोदया';sub='विषय: अवकाश प्रदान करने हेतु आवेदन';body='महोदय/महोदया,\n\nसविनय निवेदन है कि मुझे '+rs[1]+' से '+(dy?dy+' दिन का ':'')+'अवकाश आवश्यक है। अतः आपसे अनुरोध है कि कृपया मुझे उक्त अवधि के लिए अवकाश प्रदान करने की कृपा करें।\n\nमैं आपका आभारी रहूँगा/रहूँगी।'}else if(type==='school'){to=customTo||'सेवा में,\nप्रधानाचार्य महोदय/महोदया';sub='विषय: अवकाश हेतु आवेदन';body='महोदय/महोदया,\n\nसविनय निवेदन है कि '+rs[1]+' से मैं '+(dy?dy+' दिन ':'')+'विद्यालय/महाविद्यालय में उपस्थित नहीं हो पाऊँगा/पाऊँगी। कृपया मुझे आवश्यक अवकाश प्रदान करने की कृपा करें।'}else if(type==='bankmobile'){to=customTo||'सेवा में,\nशाखा प्रबंधक, बैंक';sub='विषय: बैंक खाते में मोबाइल नंबर अपडेट करने हेतु आवेदन';body='महोदय/महोदया,\n\nनिवेदन है कि मेरे बैंक खाते में दर्ज मोबाइल नंबर को अपडेट करना है। कृपया आवश्यक सत्यापन के बाद मेरे खाते में नया मोबाइल नंबर दर्ज करने की कृपा करें। आवश्यक दस्तावेज संलग्न किए जा सकते हैं।'}else if(type==='cheque'){to=customTo||'सेवा में,\nशाखा प्रबंधक, बैंक';sub='विषय: नई चेक बुक जारी करने हेतु आवेदन';body='महोदय/महोदया,\n\nनिवेदन है कि कृपया मेरे बैंक खाते के लिए नई चेक बुक जारी करने की कृपा करें। आवश्यक औपचारिकताएँ पूर्ण करने के लिए मैं तैयार हूँ।'}else if(type==='police'){to=customTo||'सेवा में,\nथाना प्रभारी महोदय/महोदया';sub='विषय: शिकायत दर्ज करने हेतु आवेदन';body='महोदय/महोदया,\n\nसविनय निवेदन है कि मैं निम्न घटना के संबंध में शिकायत दर्ज कराना चाहता/चाहती हूँ:\n\n'+p+'\n\nकृपया मामले की जाँच कर आवश्यक कार्रवाई करने की कृपा करें। उपलब्ध तथ्य/दस्तावेज आवश्यकता अनुसार प्रस्तुत किए जा सकते हैं।'}else{to=customTo||'सेवा में,\nसंबंधित अधिकारी महोदय/महोदया';sub='विषय: '+p;body='महोदय/महोदया,\n\nसविनय निवेदन है कि '+p+'। कृपया मेरे अनुरोध पर विचार कर आवश्यक कार्रवाई करने की कृपा करें।\n\nधन्यवाद।'}return to+(pl?'\n'+pl:'')+'\n\nदिनांक: '+dt+'\n\n'+sub+'\n\n'+body+'\n\nभवदीय,\n'+n}else{if(type==='office'){to=customTo||'To,\nThe Manager';sub='Subject: Request for Leave';body='Respected Sir/Madam,\n\nI respectfully request '+(dy?dy+' days of ':'')+'leave due to '+rs[0]+'. Kindly grant me leave for the required period. I will ensure that my pending responsibilities are managed appropriately.\n\nI shall be grateful for your consideration.'}else if(type==='school'){to=customTo||'To,\nThe Principal';sub='Subject: Application for Leave';body='Respected Sir/Madam,\n\nI request you to kindly grant me '+(dy?dy+' days of ':'')+'leave due to '+rs[0]+'. I will be unable to attend school/college during this period. Kindly approve my leave.'}else if(type==='bankmobile'){to=customTo||'To,\nThe Branch Manager';sub='Subject: Request to Update Mobile Number in Bank Account';body='Respected Sir/Madam,\n\nI request you to kindly update the mobile number registered with my bank account after completing the required verification. I am ready to provide the necessary documents and account details.'}else if(type==='cheque'){to=customTo||'To,\nThe Branch Manager';sub='Subject: Request for New Cheque Book';body='Respected Sir/Madam,\n\nI request you to kindly issue a new cheque book for my bank account. I am ready to complete the required formalities. Kindly process my request at the earliest.'}else if(type==='police'){to=customTo||'To,\nThe Station House Officer';sub='Subject: Request to Register Complaint';body='Respected Sir/Madam,\n\nI wish to submit a complaint regarding the following matter:\n\n'+p+'\n\nKindly record my complaint, examine the matter, and take appropriate action in accordance with applicable procedure. I can provide supporting details or documents as required.'}else if(type==='electric'){to=customTo||'To,\nThe Concerned Electricity Department Officer';sub='Subject: Electricity Complaint';body='Respected Sir/Madam,\n\nI wish to report the following electricity-related issue:\n\n'+p+'\n\nKindly inspect the matter and arrange the necessary action at the earliest.'}else{to=customTo||'To,\nThe Concerned Officer';sub='Subject: Application regarding '+p;body='Respected Sir/Madam,\n\nI am writing to request your assistance regarding the following matter:\n\n'+p+'\n\nKindly consider my request and take the necessary action.\n\nThank you for your consideration.'}return to+(pl?'\n'+pl:'')+'\n\nDate: '+dt+'\n\n'+sub+'\n\n'+body+'\n\nYours faithfully,\n'+n}}$('generate').onclick=function(){$('paper').textContent=build();$('resultCard').style.display='block';$('resultCard').scrollIntoView({behavior:'smooth'})};$('regen').onclick=$('generate').onclick;$('clear').onclick=function(){$('prompt').value='';$('resultCard').style.display='none'};$('copy').onclick=function(){var t=$('paper').innerText;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('Application copied.')});else{var r=document.createRange();r.selectNodeContents($('paper'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();alert('Application copied.')}};$('print').onclick=function(){window.print()}})();</script></body></html>
