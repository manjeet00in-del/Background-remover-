<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Scanner - Manjeet Digital Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fc;color:#172033}
header{background:#173b72;color:#fff;padding:15px;text-align:center}header h1{font-size:21px;margin:0 0 3px}header p{font-size:12px;margin:0;opacity:.85}
.wrap{max-width:1050px;margin:auto;padding:14px;display:grid;grid-template-columns:360px 1fr;gap:14px}
.panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 15px #0001;margin-bottom:12px}
h3{font-size:16px;margin:0 0 11px}.upload{display:block;border:2px dashed #8aa4c7;border-radius:12px;padding:20px;text-align:center;background:#f8fbff;cursor:pointer}.upload input{display:none}
.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:700;background:#173b72;color:#fff;cursor:pointer}.green{background:#16834b}.gray{background:#64748b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions .btn{flex:1}
.row{display:flex;gap:9px;align-items:center;margin:11px 0}.row label{font-size:13px;font-weight:700;min-width:90px}.row select{width:100%;padding:9px;border:1px solid #ccd5e1;border-radius:8px}input[type=range]{width:100%}
.stage{background:#dbe4ef;border-radius:12px;min-height:470px;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.cw{position:relative;display:inline-block;touch-action:none}.cw canvas{display:block;max-width:100%;max-height:70vh;background:#fff}
.crop{position:absolute;border:2px dashed #1976d2;background:#1976d216;touch-action:none;cursor:move}.handle{position:absolute;width:24px;height:24px;border-radius:50%;background:#1976d2;border:3px solid white}
.tl{left:-12px;top:-12px}.tr{right:-12px;top:-12px}.bl{left:-12px;bottom:-12px}.br{right:-12px;bottom:-12px}.hide{display:none}.hint{font-size:11px;color:#64748b;line-height:1.4}
.mobilePreview{display:none}.mobilePreview canvas{max-width:100%;max-height:125px;display:block;margin:auto;background:#fff}
@media(max-width:760px){
 .wrap{grid-template-columns:1fr;padding-top:8px}.stage{min-height:360px}.desktopStage{display:none}
 .mobilePreview{display:block;position:sticky;top:0;z-index:50;background:#f3f7fcf5;margin:0 -14px 10px;padding:7px 12px;border-bottom:1px solid #d7e0eb;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
 .mobilePreview h3{font-size:12px;text-align:center;margin:0 0 5px}.mobilePreview canvas{height:118px;width:auto}
}
@media print{body *{visibility:hidden!important}#printPage,#printPage *{visibility:visible!important}#printPage{display:flex!important;position:absolute;inset:0;width:100%;height:100%;align-items:center;justify-content:center;background:#fff}#printPage img{max-width:190mm;max-height:277mm}}
</style></head>
<body>
<header><h1>📑 Document Scanner</h1><p>Manjeet Digital Hub • Crop • Enhance • B&W • PDF</p></header>
<div class="wrap">
<div>
 <div class="mobilePreview"><h3>Live Document Preview</h3><canvas id="mobileCanvas"></canvas></div>
 <div class="panel">
  <h3>1. Upload / Camera</h3>
  <label class="upload"><input id="file" type="file" accept="image/*"><b>📷 Select Document Photo</b><br><small>Gallery या Camera से photo चुनें</small></label>
  <div class="actions"><button class="btn gray" id="left">↶ Rotate</button><button class="btn gray" id="right">Rotate ↷</button></div>
 </div>
 <div class="panel">
  <h3>2. Crop & Enhance</h3>
  <div class="row"><label>Brightness</label><input id="brightness" type="range" min="50" max="170" value="100"></div>
  <div class="row"><label>Contrast</label><input id="contrast" type="range" min="50" max="220" value="100"></div>
  <div class="row"><label>Mode</label><select id="mode"><option value="color">Color</option><option value="clean">Clean Document</option><option value="gray">Grayscale</option><option value="bw">Black & White</option></select></div>
  <div class="actions"><button class="btn gray" id="resetCrop">Reset Crop</button><button class="btn" id="applyCrop">Apply Crop</button></div>
  <button class="btn gray" id="resetAll" style="width:100%;margin-top:8px">↻ Reset All</button>
  <p class="hint">Blue box को finger से move करें। चार blue circles से crop area resize करें।</p>
 </div>
 <div class="panel">
  <h3>3. Download / Print</h3>
  <div class="actions"><button class="btn green" id="jpg">⬇ JPG</button><button class="btn green" id="png">⬇ PNG</button></div>
  <button class="btn green" id="pdf" style="width:100%;margin-top:8px">🖨 A4 PDF / Print</button>
 </div>
</div>
<div>
 <div class="panel desktopStage"><h3>Document Preview & Crop</h3><div class="stage"><div id="cw" class="cw"><canvas id="canvas"></canvas><div id="crop" class="crop hide"><i class="handle tl" data-h="tl"></i><i class="handle tr" data-h="tr"></i><i class="handle bl" data-h="bl"></i><i class="handle br" data-h="br"></i></div></div></div></div>
</div>
</div>
<div id="printPage" style="display:none"><img id="printImg"></div>
<script>
const $=id=>document.getElementById(id),can=$('canvas'),ctx=can.getContext('2d'),mc=$('mobileCanvas'),mctx=mc.getContext('2d');
let original=null,img=null,angle=0,cr={x:0,y:0,w:0,h:0},drag=null;
function filters(){
 let m=$('mode').value,b=+$('brightness').value,c=+$('contrast').value;
 if(m==='clean'){b=Math.max(b,112);c=Math.max(c,125)}
 let x=`brightness(${b}%) contrast(${c}%)`;
 if(m==='gray')x+=' grayscale(1)';
 if(m==='bw')x+=' grayscale(1) contrast(2.2)';
 return x
}
function loadFile(f){if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{original=i;img=i;angle=0;draw();resetCrop()};i.src=r.result};r.readAsDataURL(f)}
$('file').onchange=e=>loadFile(e.target.files[0]);
function draw(){
 if(!img)return;
 let swap=Math.abs(angle%180)===90,w=swap?img.naturalHeight:img.naturalWidth,h=swap?img.naturalWidth:img.naturalHeight;
 let s=Math.min(1,1000/Math.max(w,h));can.width=Math.round(w*s);can.height=Math.round(h*s);
 ctx.clearRect(0,0,can.width,can.height);ctx.save();ctx.filter=filters();ctx.translate(can.width/2,can.height/2);ctx.rotate(angle*Math.PI/180);
 ctx.drawImage(img,-img.naturalWidth*s/2,-img.naturalHeight*s/2,img.naturalWidth*s,img.naturalHeight*s);ctx.restore();
 $('cw').style.width=can.width+'px';$('cw').style.height=can.height+'px';updateMobile()
}
function updateMobile(){
 if(!img)return;let fc=finalCanvas();if(!fc)return;
 let scale=Math.min(1,280/fc.width);mc.width=Math.max(1,Math.round(fc.width*scale));mc.height=Math.max(1,Math.round(fc.height*scale));
 mctx.clearRect(0,0,mc.width,mc.height);mctx.drawImage(fc,0,0,mc.width,mc.height)
}
function resetCrop(){if(!img)return;$('crop').classList.remove('hide');cr={x:can.width*.06,y:can.height*.06,w:can.width*.88,h:can.height*.88};positionCrop();updateMobile()}
function positionCrop(){let e=$('crop');e.style.left=cr.x+'px';e.style.top=cr.y+'px';e.style.width=cr.w+'px';e.style.height=cr.h+'px'}
$('resetCrop').onclick=resetCrop;
$('left').onclick=()=>{if(img){angle-=90;draw();resetCrop()}};
$('right').onclick=()=>{if(img){angle+=90;draw();resetCrop()}};
['brightness','contrast','mode'].forEach(id=>$(id).oninput=()=>{draw();positionCrop()});
$('crop').onpointerdown=e=>{if(!img)return;e.preventDefault();drag={h:e.target.dataset.h||'move',sx:e.clientX,sy:e.clientY,o:{...cr}};$('crop').setPointerCapture(e.pointerId)};
$('crop').onpointermove=e=>{
 if(!drag)return;let R=can.getBoundingClientRect(),dx=(e.clientX-drag.sx)*can.width/R.width,dy=(e.clientY-drag.sy)*can.height/R.height,o=drag.o,n={...o},min=45;
 if(drag.h==='move'){n.x=o.x+dx;n.y=o.y+dy}else{
  if(drag.h.includes('r'))n.w=o.w+dx;if(drag.h.includes('b'))n.h=o.h+dy;
  if(drag.h.includes('l')){n.x=o.x+dx;n.w=o.w-dx}if(drag.h.includes('t')){n.y=o.y+dy;n.h=o.h-dy}
 }
 n.w=Math.max(min,n.w);n.h=Math.max(min,n.h);n.x=Math.max(0,Math.min(can.width-min,n.x));n.y=Math.max(0,Math.min(can.height-min,n.y));n.w=Math.min(can.width-n.x,n.w);n.h=Math.min(can.height-n.y,n.h);cr=n;positionCrop();updateMobile()
};
$('crop').onpointerup=$('crop').onpointercancel=()=>drag=null;
function finalCanvas(){
 if(!img||!cr.w)return null;let o=document.createElement('canvas');o.width=Math.round(cr.w);o.height=Math.round(cr.h);
 o.getContext('2d').drawImage(can,cr.x,cr.y,cr.w,cr.h,0,0,o.width,o.height);return o
}
$('applyCrop').onclick=()=>{let o=finalCanvas();if(!o)return alert('पहले document photo upload करें।');let i=new Image();i.onload=()=>{img=i;angle=0;draw();resetCrop()};i.src=o.toDataURL('image/png')};
$('resetAll').onclick=()=>{if(!original)return;img=original;angle=0;$('brightness').value=100;$('contrast').value=100;$('mode').value='color';draw();resetCrop()};
function download(type,ext){let o=finalCanvas();if(!o)return alert('पहले document photo upload करें।');let a=document.createElement('a');a.download='manjeet-document.'+ext;a.href=o.toDataURL(type,.95);a.click()}
$('jpg').onclick=()=>download('image/jpeg','jpg');$('png').onclick=()=>download('image/png','png');
$('pdf').onclick=()=>{
 let o=finalCanvas();if(!o)return alert('पहले document photo upload करें।');
 $('printImg').src=o.toDataURL('image/jpeg',.96);$('printPage').style.display='flex';setTimeout(()=>{window.print();setTimeout(()=>$('printPage').style.display='none',500)},250)
};
</script></body></html>
