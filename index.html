<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe AI Background Remover</title>
    <!-- Google MediaPipe लाइब्रेरी -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 40px; 
            background-color: #f4f4f9;
        }
        canvas { 
            max-width: 400px; 
            margin-top: 20px; 
            border: 2px dashed #ccc; 
            display: none; 
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYNgfQEhjw8T//x8YmBjgNJaRUIUoGkY1gNGAwWgYRjWA0YDBaBgmNgAAS3E+f+9+kZMAAAAASUVORK5CYII='); /* Transparent checkerboard bg */
        }
        .status { 
            color: #007bff; 
            font-weight: bold; 
            margin-top: 15px; 
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: none;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>Fast AI Background Remover</h2>
    <p>Powered by Google MediaPipe (Works on Older PCs)</p>

    <input type="file" id="upload" accept="image/*">
    <div id="status" class="status"></div>
    
    <br>
    <!-- कैनवस जहाँ फाइनल फोटो दिखेगी -->
    <canvas id="canvas"></canvas><br>
    <a id="download-btn" class="btn" download="no-bg.png">Download Photo</a>

    <script>
        const uploadInput = document.getElementById('upload');
        const statusText = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');

        // 1. MediaPipe Selfie Segmentation सेटअप करना
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});

        selfieSegmentation.setOptions({
            modelSelection: 1, // 1 = हल्का और फ़ास्ट मॉडल
        });

        // 2. जब AI अपना काम पूरा कर ले, तब क्या करना है:
        selfieSegmentation.onResults((results) => {
            canvas.width = results.image.width;
            canvas.height = results.image.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // बैकग्राउंड को ट्रांसपेरेंट बनाना
            ctx.globalCompositeOperation = 'copy';
            ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);

            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            canvas.style.display = 'inline';
            downloadBtn.href = canvas.toDataURL('image/png');
            downloadBtn.style.display = 'inline-block';
            
            statusText.innerText = "✅ बैकग्राउंड हटा दिया गया! (0 Cost)";
        });

        let currentImg = new Image();

        // 3. फोटो अपलोड होने पर प्रोसेसिंग शुरू करना
        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusText.innerText = "⏳ फोटो प्रोसेस हो रही है... कृपया प्रतीक्षा करें।";
            canvas.style.display = 'none';
            downloadBtn.style.display = 'none';

            const url = URL.createObjectURL(file);
            currentImg.src = url;
            
            currentImg.onload = async () => {
                // इमेज को MediaPipe के पास भेजना
                await selfieSegmentation.send({image: currentImg});
            };
        });
    </script>
</body>
</html>
