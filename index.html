<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PVC Card Maker</title>
    <!-- jsPDF Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Header */
        .header {
            width: 100%;
            background-color: #3b5998;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* A4 Preview Area (Workspace) */
        .workspace {
            margin: 20px;
            width: 210mm; /* A4 Width */
            height: 297mm; /* A4 Height */
            background-color: white;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
            position: relative;
            transform: scale(0.4); /* Scaled down for screen viewing */
            transform-origin: top center;
            margin-bottom: -150mm; /* Adjusting space due to scale */
        }
        
        /* PVC Card Container (Standard Size 85.6 x 54 mm) */
        .pvc-card {
            width: 85.6mm;
            height: 54mm;
            position: absolute;
            top: 20mm;
            left: 20mm;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px dashed #ccc; /* Default cut-line */
        }
        .pvc-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        /* Toolbar & Controls */
        .toolbar {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
        }
        
        /* Action Buttons */
        .btn-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-rotate { background-color: #9b59b6; }
        .btn-border { background-color: #3498db; }
        .btn-clear { background-color: #e74c3c; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        
        .action-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
        }
        .action-btn i { font-size: 24px; margin-bottom: 5px; }
        
        .upload-btn { color: #2980b9; }
        .pdf-btn { color: #c0392b; }
        .print-btn { color: #27ae60; background: #e8f8f5; border: 1px solid #27ae60;}

        /* Hide elements during printing */
        @media print {
            body { background: white; }
            .header, .toolbar { display: none !important; }
            .workspace { 
                transform: scale(1); 
                box-shadow: none; 
                margin: 0; 
                border: none;
            }
            @page { margin: 0; size: A4; }
        }
    </style>
</head>
<body>

    <div class="header">
        PVC Card Maker (Zero Cost)
    </div>

    <!-- A4 Sheet Preview -->
    <div class="workspace" id="print-area">
        <div class="pvc-card" id="card-container">
            <span id="placeholder" style="color: #aaa; font-size: 20px;">Upload Image</span>
            <img id="card-img" style="display: none;" />
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="toolbar">
        <!-- Edit Tools -->
        <div style="display: flex; gap: 15px; width: 100%; justify-content: center;">
            <button class="btn-circle btn-rotate" onclick="rotateImage()" title="Rotate 90°">↻</button>
            <button class="btn-circle btn-border" onclick="toggleBorder()" title="Add/Remove Border">⬜</button>
            <button class="btn-circle btn-clear" onclick="clearImage()" title="Clear">🗑️</button>
        </div>

        <!-- Main Actions -->
        <div class="action-bar">
            <!-- Hidden File Input -->
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <button class="action-btn upload-btn" onclick="document.getElementById('file-input').click()">
                <i>📁</i> SELECT FILE
            </button>
            <button class="action-btn pdf-btn" onclick="downloadPDF()">
                <i>📄</i> PDF
            </button>
            <button class="action-btn print-btn" onclick="window.print()">
                <i>🖨️</i> PRINT
            </button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const cardImg = document.getElementById('card-img');
        const placeholder = document.getElementById('placeholder');
        const cardContainer = document.getElementById('card-container');
        
        let currentRotation = 0;
        let hasBorder = false;

        // 1. Upload Image
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    cardImg.src = e.target.result;
                    cardImg.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. Rotate Image Tool
        function rotateImage() {
            currentRotation = (currentRotation + 90) % 360;
            cardImg.style.transform = `rotate(${currentRotation}deg)`;
        }

        // 3. Toggle Cut Border Tool
        function toggleBorder() {
            hasBorder = !hasBorder;
            cardContainer.style.border = hasBorder ? "2px solid black" : "1px dashed #ccc";
        }

        // 4. Clear Tool
        function clearImage() {
            cardImg.src = "";
            cardImg.style.display = 'none';
            placeholder.style.display = 'block';
            currentRotation = 0;
            cardImg.style.transform = `rotate(0deg)`;
            fileInput.value = "";
        }

        // 5. Download as A4 PDF (Using jsPDF)
        function downloadPDF() {
            if (cardImg.src === "" || cardImg.style.display === 'none') {
                alert("Please upload an image first!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            // Convert current image rotation to PDF (simplified for 0 and 90)
            // Note: Advanced rotation in jsPDF requires canvas, but for standard PVC, 
            // we place it at Top: 20mm, Left: 20mm, Size: 85.6 x 54 mm
            
            // For now, we will draw the image directly at PVC size.
            // If border is enabled, draw a rectangle
            if (hasBorder) {
                doc.setDrawColor(0);
                doc.setLineWidth(0.5);
                doc.rect(20, 20, 85.6, 54);
            }

            // Draw Image
            doc.addImage(cardImg.src, 'JPEG', 20, 20, 85.6, 54);
            
            // Save the PDF
            doc.save("PVC_Card_Print.pdf");
        }
    </script>
</body>
</html>
