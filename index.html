<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Avatar Video Maker (0 Cost)</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #1e1e2f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            padding: 15px;
            background: #2a2a40;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .controls {
            display: flex;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }
        .control-group {
            background: #383854;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        button, input[type="file"] {
            background: #4facfe;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00f2fe; color: black; }
        
        /* 3D Canvas Area */
        #video-container {
            width: 800px;
            height: 450px;
            background-color: #000;
            background-size: cover;
            background-position: center;
            position: relative;
            border: 4px solid #4facfe;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #audio-player { display: none; }
    </style>
</head>
<body>

    <div class="header">🎬 3D Avatar Video Maker (Lip-Sync AI)</div>

    <div class="controls">
        <div class="control-group">
            <label>1. Set Background Image</label>
            <input type="file" id="bg-upload" accept="image/*">
        </div>
        <div class="control-group">
            <label>2. Upload 3D Avatar (.glb)</label>
            <input type="file" id="avatar-upload" accept=".glb">
        </div>
        <div class="control-group">
            <label>3. Upload Audio File</label>
            <input type="file" id="audio-upload" accept="audio/*">
        </div>
        <div class="control-group" style="justify-content: center;">
            <button id="play-btn" style="background: #2ecc71; padding: 15px 30px; font-size: 16px;">▶️ Play & Sync</button>
        </div>
    </div>

    <div id="video-container">
        <!-- 3D Canvas will be injected here -->
    </div>
    <audio id="audio-player" controls></audio>

    <script>
        // --- 1. Basic Setup (Three.js) ---
        const container = document.getElementById('video-container');
        
        const scene = new THREE.Scene();
        // Transparent background so CSS background image shows through
        const camera = new THREE.PerspectiveCamera(45, 800 / 450, 0.1, 100);
        camera.position.set(0, 1.5, 3); // कैमरा अवतार के चेहरे के सामने

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(800, 450);
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(0, 2, 2);
        scene.add(directionalLight);

        let currentAvatar = null;
        let headMesh = null;
        let mouthOpenIdx = -1;

        // --- 2. Handle File Uploads ---
        
        // Background Upload
        document.getElementById('bg-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                container.style.backgroundImage = `url(${url})`;
            }
        });

        // 3D Avatar (.glb) Upload
        document.getElementById('avatar-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const loader = new THREE.GLTFLoader();

            loader.load(url, (gltf) => {
                // पुरानी मॉडल हटा दें
                if (currentAvatar) scene.remove(currentAvatar);
                
                currentAvatar = gltf.scene;
                currentAvatar.position.set(0, -1, 0);
                scene.add(currentAvatar);

                // होंठ हिलाने के लिए (Morph Targets) ढूँढना
                currentAvatar.traverse((child) => {
                    if (child.isMesh && child.morphTargetDictionary) {
                        // Ready Player Me मॉडल्स में 'mouthOpen' या 'viseme_O' होता है
                        if (child.morphTargetDictionary['mouthOpen'] !== undefined) {
                            headMesh = child;
                            mouthOpenIdx = child.morphTargetDictionary['mouthOpen'];
                        } else if (child.morphTargetDictionary['viseme_O'] !== undefined) {
                            headMesh = child;
                            mouthOpenIdx = child.morphTargetDictionary['viseme_O'];
                        }
                    }
                });
            });
        });

        // Audio Upload
        const audioPlayer = document.getElementById('audio-player');
        document.getElementById('audio-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
            }
        });

        // --- 3. Audio Lip-Sync Logic (Web Audio API) ---
        let audioContext, analyser, dataArray;
        let isAudioSetup = false;

        document.getElementById('play-btn').addEventListener('click', () => {
            if (!audioPlayer.src) {
                alert("Please upload an audio file first!");
                return;
            }
            
            // Audio API सिर्फ यूजर क्लिक पर ही शुरू होता है
            if (!isAudioSetup) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaElementSource(audioPlayer);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioSetup = true;
            }
            
            audioContext.resume();
            audioPlayer.play();
        });

        // --- 4. Render Loop (Animation) ---
        function animate() {
            requestAnimationFrame(animate);

            // Lip Sync: आवाज़ के हिसाब से मुँह खोलना
            if (isAudioSetup && headMesh && mouthOpenIdx !== -1) {
                analyser.getByteFrequencyData(dataArray);
                
                // आवाज़ की वॉल्यूम कैलकुलेट करना
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let averageVolume = sum / dataArray.length;
                
                // वॉल्यूम को 0.0 से 1.0 के बीच मैप करना (ताकि मुँह खुले)
                let mouthOpenAmount = (averageVolume / 255) * 2.5; 
                
                // मुँह को बहुत ज्यादा फटने से रोकना
                if(mouthOpenAmount > 1) mouthOpenAmount = 1;

                // अवतार के होंठों पर वैल्यू अप्लाई करना
                headMesh.morphTargetInfluences[mouthOpenIdx] = mouthOpenAmount;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
