<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PVC Auto Crop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#edf2f8;color:#172033}.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px;border-bottom:1px solid #dbe4ef}.bar{max-width:900px;margin:auto;display:flex;gap:8px}.bar button{height:44px;border:1px solid #dbe4ef;border-radius:13px;font-weight:800}.home,.del{width:48px;background:#f8fbff}.del{color:#e11d48}.title{flex:1;background:#2563eb;color:#fff}.wrap{max-width:900px;margin:auto;padding:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:5px 0 12px}.pick{background:#fff;border:1px solid #d6e2ef;border-bottom:4px solid #c5d5e8;border-radius:16px;text-align:center;padding:11px 3px;font-size:10px;font-weight:800;box-shadow:0 5px 10px #64748b1f}.pick span{display:block;font-size:23px;margin-bottom:5px}.pick.on{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8}.pick input{display:none}.box{background:#fff;border:1px solid #dbe4ef;border-radius:18px;padding:9px;box-shadow:0 8px 22px #0f172a12}.stage{position:relative;min-height:410px;background:#f8fafc;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}.stage canvas{max-width:100%;max-height:66vh}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.empty{text-align:center;color:#94a3b8}.empty b{display:block;color:#475569;font-size:18px;margin-bottom:7px}.status{text-align:center;color:#64748b;font-size:11px;padding:9px}.controls{display:none}.controls.show{display:block}.row{display:flex;gap:7px;margin-top:7px}.btn{flex:1;border:0;border-radius:12px;padding:11px 4px;background:#2563eb;color:#fff;font-weight:800;font-size:11px}.alt{background:#fff;color:#2563eb;border:1px solid #bfdbfe}.green{background:#16a34a}.note{text-align:center;font-size:9px;color:#64748b}.results{display:none;margin-top:12px;background:#fff;border-radius:18px;padding:11px;border:1px solid #dbe4ef}.results.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#f1f5f9;border-radius:11px;padding:7px;text-align:center}.card img{width:100%;border-radius:6px}.card small{display:block;margin-top:5px}.out{display:flex;gap:7px;margin-top:9px}.out button{flex:1;border:0;border-radius:11px;padding:11px 3px;color:#fff;font-weight:800}.jpg{background:#2563eb}.pdf{background:#ef4444}.print{background:#111827}@media(max-width:480px){.stage{min-height:380px}}</style></head>
<body><div class="top"><div class="bar"><button class="home" onclick="location.href='../index.html'">⌂</button><button class="del" onclick="resetAll()">🗑</button><button class="title">PVC AUTO CROP</button></div></div>
<div class="wrap">
<label class="pick on" style="display:block;max-width:420px;margin:6px auto 12px;padding:15px" id="pf">
<span>📁</span>UPLOAD FILE
<div style="font-weight:400;color:#64748b;margin-top:4px">JPG, PNG or PDF</div>
<input id="full" type="file" accept="image/*,application/pdf">
</label>
<div class="box"><div class="stage" id="stage"><div class="empty" id="empty"><b>Select File</b>PDF/full page, front or back image</div><canvas id="src"></canvas><canvas id="ov" class="overlay"></canvas></div><div class="status" id="status">Upload a file — card will auto detect and crop</div>
<div class="controls" id="controls"><div class="row"><button class="btn" onclick="autoCrop()">⚡ AUTO CROP</button><button class="btn alt" onclick="ratio()">▭ PVC RATIO</button><button class="btn alt" onclick="rotate()">↻ ROTATE</button></div><div class="row"><button class="btn green" onclick="addCard()">✓ CROP CARD</button><button class="btn alt" onclick="corners()">RESET</button></div><div class="note">Card is detected automatically. Drag blue corners only if correction is needed.</div></div></div>
<div class="results" id="results"><b>Cropped PVC Cards</b><div class="grid" id="grid"></div><div class="out"><button class="jpg" onclick="download()">⬇ CARD</button><button class="pdf" onclick="pdfOut()">PDF</button><button class="jpg" onclick="pngOut()">PNG</button><button class="print" onclick="printOut()">🖨 PRINT</button></div></div></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const src=document.getElementById("src"),ctx=src.getContext("2d"),ov=document.getElementById("ov"),ox=ov.getContext("2d"),stage=document.getElementById("stage");let img=null,rot=0,pts=[],drag=-1,label="Full Page",cards=[];
full.onchange=e=>{label="PVC Card";load(e.target.files[0])};
async function load(f){if(!f)return;if(f.type==="application/pdf"){let p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,page=await p.getPage(1),v=page.getViewport({scale:2}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise;loadUrl(c.toDataURL("image/jpeg",.96))}else{let r=new FileReader;r.onload=()=>loadUrl(r.result);r.readAsDataURL(f)}}
function loadUrl(u){let i=new Image;i.onload=()=>{img=i;rot=0;draw();corners();empty.style.display="none";controls.classList.add("show");status.textContent="Detecting card...";setTimeout(autoCrop,80)};i.src=u}
function draw(){let w=img.width,h=img.height;if(rot%180)[w,h]=[h,w];let sc=Math.min(1,1600/Math.max(w,h));src.width=w*sc;src.height=h*sc;ctx.save();ctx.translate(src.width/2,src.height/2);ctx.rotate(rot*Math.PI/180);ctx.drawImage(img,-img.width*sc/2,-img.height*sc/2,img.width*sc,img.height*sc);ctx.restore();ov.width=stage.clientWidth;ov.height=stage.clientHeight}
function box(){let a=src.getBoundingClientRect(),b=stage.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
function corners(){let b=box(),m=Math.min(18,b.w*.04);pts=[[b.x+m,b.y+m],[b.x+b.w-m,b.y+m],[b.x+b.w-m,b.y+b.h-m],[b.x+m,b.y+b.h-m]];paint()}
function paint(){ov.width=stage.clientWidth;ov.height=stage.clientHeight;ox.clearRect(0,0,ov.width,ov.height);if(!pts.length)return;ox.fillStyle="#0f172a66";ox.fillRect(0,0,ov.width,ov.height);ox.save();ox.globalCompositeOperation="destination-out";ox.beginPath();ox.moveTo(...pts[0]);pts.slice(1).forEach(p=>ox.lineTo(...p));ox.closePath();ox.fill();ox.restore();ox.strokeStyle="#2563eb";ox.lineWidth=3;ox.beginPath();ox.moveTo(...pts[0]);pts.slice(1).forEach(p=>ox.lineTo(...p));ox.closePath();ox.stroke();pts.forEach(p=>{ox.beginPath();ox.arc(p[0],p[1],10,0,7);ox.fillStyle="#fff";ox.fill();ox.lineWidth=4;ox.strokeStyle="#2563eb";ox.stroke()})}
function xy(e){let r=stage.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}function down(e){let p=xy(e),d=99;drag=-1;pts.forEach((q,i)=>{let n=Math.hypot(p[0]-q[0],p[1]-q[1]);if(n<35&&n<d){d=n;drag=i}});if(drag>=0)e.preventDefault()}function move(e){if(drag<0)return;e.preventDefault();let p=xy(e),b=box();pts[drag]=[Math.max(b.x,Math.min(b.x+b.w,p[0])),Math.max(b.y,Math.min(b.y+b.h,p[1]))];paint()}function up(){drag=-1}stage.addEventListener("touchstart",down,{passive:false});stage.addEventListener("touchmove",move,{passive:false});stage.addEventListener("touchend",up);stage.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
function autoCrop(){let b=box(),D=ctx.getImageData(0,0,src.width,src.height).data,w=src.width,h=src.height,cs=[[2,2],[w-3,2],[2,h-3],[w-3,h-3]].map(q=>{let i=(q[1]*w+q[0])*4;return[D[i],D[i+1],D[i+2]]}),bg=[0,1,2].map(k=>cs.reduce((a,c)=>a+c[k],0)/4),mnx=w,mny=h,mxx=0,mxy=0,n=0,st=Math.max(1,Math.floor(Math.max(w,h)/650));for(let y=0;y<h;y+=st)for(let x=0;x<w;x+=st){let i=(y*w+x)*4,z=Math.abs(D[i]-bg[0])+Math.abs(D[i+1]-bg[1])+Math.abs(D[i+2]-bg[2]);if(z>80){mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);n++}}if(n<30){status.textContent="Edge not clear - adjust corners manually";return}let sx=b.w/w,sy=b.h/h;pts=[[b.x+mnx*sx,b.y+mny*sy],[b.x+mxx*sx,b.y+mny*sy],[b.x+mxx*sx,b.y+mxy*sy],[b.x+mnx*sx,b.y+mxy*sy]];paint();status.textContent="Auto crop ready - check corners"}
function ratio(){let b=box(),r=85.6/54,W=b.w*.88,H=W/r;if(H>b.h*.88){H=b.h*.88;W=H*r}let x=b.x+b.w/2,y=b.y+b.h/2;pts=[[x-W/2,y-H/2],[x+W/2,y-H/2],[x+W/2,y+H/2],[x-W/2,y+H/2]];paint()}
function rotate(){rot=(rot+90)%360;draw();corners()}
function crop(){let b=box(),sx=src.width/b.w,sy=src.height/b.h,p=pts.map(q=>[(q[0]-b.x)*sx,(q[1]-b.y)*sy]),x=Math.max(0,Math.min(...p.map(q=>q[0]))),X=Math.min(src.width,Math.max(...p.map(q=>q[0]))),y=Math.max(0,Math.min(...p.map(q=>q[1]))),Y=Math.min(src.height,Math.max(...p.map(q=>q[1]))),W=X-x,H=Y-y,land=W>=H,c=document.createElement("canvas");c.width=land?1011:638;c.height=land?638:1011;c.getContext("2d").drawImage(src,x,y,W,H,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.96)}
function addCard(){if(!img)return;cards.push({label,url:crop()});render();status.textContent=label+" added"}
function render(){grid.innerHTML="";cards.forEach((c,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML='<img src="'+c.url+'"><small>'+c.label+' · <a href="#" onclick="cards.splice('+i+',1);render();return false">Remove</a></small>';grid.appendChild(d)});results.classList.toggle("show",cards.length>0)}
function download(){cards.forEach((c,i)=>{let a=document.createElement("a");a.href=c.url;a.download="pvc-"+c.label.toLowerCase().replace(" ","-")+"-"+(i+1)+".jpg";a.click()})}
function pngOut(){if(!cards.length)return;cards.forEach((c,i)=>{let im=new Image();im.onload=()=>{let cv=document.createElement("canvas");cv.width=im.width;cv.height=im.height;cv.getContext("2d").drawImage(im,0,0);let a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="pvc-card-"+(i+1)+".png";a.click()};im.src=c.url})}
function pdfOut(){if(!cards.length)return;let {jsPDF}=window.jspdf,p=new jsPDF({unit:"mm",format:"a4"});cards.forEach((c,i)=>{if(i)p.addPage();p.addImage(c.url,"JPEG",62.2,25,85.6,54)});p.save("pvc-cards.pdf")}
function printOut(){if(!cards.length)return;let w=window.open("","_blank");w.document.write('<style>@page{size:A4;margin:15mm}body{text-align:center}img{width:85.6mm;height:54mm;margin:8mm}</style>'+cards.map(c=>'<img src="'+c.url+'">').join("")+'<script>onload=()=>print()<\/script>');w.document.close()}
function resetAll(){img=null;cards=[];src.width=src.height=1;empty.style.display="block";controls.classList.remove("show");results.classList.remove("show");grid.innerHTML="";status.textContent="Upload a file — card will auto detect and crop";full.value=""}
</script></body></html>
