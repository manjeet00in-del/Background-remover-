<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee ID Card Maker - Manjeet Digital Hub</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fc;color:#14213d}
header{background:#0d47a1;color:#fff;padding:16px;text-align:center}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:13px}
.wrap{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
.panel{background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 18px #0001}.panel h2{font-size:17px;margin:4px 0 12px}
label{font-size:12px;font-weight:700;display:block;margin:9px 0 4px}input,select,textarea,button{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}
textarea{resize:vertical;min-height:55px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;background:#0d47a1;color:white;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#455a64}.green{background:#15803d}.danger{background:#b91c1c}
.templates{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tpl{padding:8px 3px;font-size:11px;background:#eef4ff;color:#123;border:2px solid transparent}.tpl.active{border-color:#0d47a1;background:#dceaff}
.stage{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:8px}
.card{position:relative;overflow:hidden;background:#fff;box-shadow:0 4px 20px #0003;color:#14213d;flex:none}
.card.portrait{width:324px;height:510px}.card.landscape{width:510px;height:324px}
.design{position:absolute;inset:0}.content{position:absolute;inset:0;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center}
.landscape .content{padding:24px 28px;text-align:left;align-items:flex-start}
.company{font-size:18px;font-weight:800;max-width:85%;z-index:2}.logo{width:54px;height:54px;object-fit:contain;margin-bottom:6px;z-index:2}
.photo{width:126px;height:146px;object-fit:cover;border-radius:10px;border:4px solid white;box-shadow:0 2px 8px #0003;margin:16px 0 10px;z-index:2;background:#ddd}
.landscape .photo{position:absolute;width:130px;height:154px;left:28px;top:88px;margin:0}
.empName{font-size:23px;font-weight:900;z-index:2}.role{font-size:14px;font-weight:700;margin:3px 0 11px;z-index:2}
.details{font-size:12px;line-height:1.7;z-index:2}.landscape .empName,.landscape .role,.landscape .details{margin-left:155px}.landscape .empName{margin-top:32px}
.qr{position:absolute;width:68px;height:68px;right:18px;bottom:18px;background:#fff;padding:4px;z-index:3}
.backcontent{position:absolute;inset:0;padding:30px;z-index:2}.backcontent h3{text-align:center;margin:4px 0 20px}.backcontent p{font-size:12px;line-height:1.55}.sign{border-top:1px solid currentColor;width:120px;text-align:center;font-size:10px;margin-top:28px}
.t1 .design{background:linear-gradient(155deg,#0755c9 0 27%,#fff 27% 100%)}.t1 .company{color:#fff}.t2 .design{background:linear-gradient(180deg,#111827 0 18%,#fff 18% 85%,#d5a52e 85%)}.t2 .company{color:#fff}
.t3 .design{background:linear-gradient(145deg,#6b1028 0 31%,#fff 31%)}.t3 .company{color:#fff}.t4 .design{background:linear-gradient(160deg,#fff 0 72%,#0b6e99 72%)}.t4 .company{color:#075985}
.t5 .design{background:linear-gradient(135deg,#101827 0 36%,#f8fafc 36%)}.t5 .company{color:#fff}.t6 .design{background:linear-gradient(135deg,#6d28d9,#2563eb 32%,#fff 32%)}.t6 .company{color:#fff}
.t7 .design{background:linear-gradient(180deg,#047857 0 24%,#fff 24% 92%,#047857 92%)}.t7 .company{color:#fff}.t8 .design{background:linear-gradient(135deg,#0f172a 0 72%,#d4af37 72%)}.t8{color:#fff}.t8 .photo{border-color:#d4af37}
.t9 .design{background:linear-gradient(155deg,#e8f2ff 0 50%,#fff 50%);border-top:12px solid #2563eb}.t10 .design{background:linear-gradient(145deg,#fff 0 72%,#ef5b2a 72%);border-top:12px solid #ef5b2a}
.note{font-size:12px;color:#607080;margin-top:10px}.downloads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.templates{grid-template-columns:repeat(2,1fr)}.stage{transform-origin:top center}.downloads{grid-template-columns:1fr}}
@media(max-width:550px){.card.landscape{transform:scale(.68);margin:-50px -82px}.card.portrait{transform:scale(.88);margin:-30px -18px}}
</style>
</head><body>
<header><h1>Employee ID Card Maker</h1><p>Manjeet Digital Hub • Front & Back • 10 Professional Templates</p></header>
<div class="wrap"><div class="grid">
<div class="panel">
<h2>Employee Details</h2>
<div class="row"><div><label>Orientation</label><select id="orientation"><option value="portrait">Vertical / Portrait</option><option value="landscape">Horizontal / Landscape</option></select></div><div><label>Employee ID</label><input id="empid" value="EMP-001"></div></div>
<label>Company Name</label><input id="company" value="YOUR COMPANY">
<div class="row"><div><label>Company Logo</label><input id="logoFile" type="file" accept="image/*"></div><div><label>Employee Photo</label><input id="photoFile" type="file" accept="image/*"></div></div>
<label>Employee Name</label><input id="name" value="John Doe">
<div class="row"><div><label>Designation</label><input id="designation" value="Manager"></div><div><label>Department</label><input id="department" value="Operations"></div></div>
<div class="row"><div><label>Phone</label><input id="phone" value="+91 98765 43210"></div><div><label>Blood Group</label><input id="blood" value="O+"></div></div>
<div class="row"><div><label>Joining Date</label><input id="joining" value="01-01-2026"></div><div><label>DOB</label><input id="dob" value="01-01-1995"></div></div>
<label>Address</label><textarea id="address">Lucknow, Uttar Pradesh</textarea>
<label>Emergency Contact</label><input id="emergency" value="+91 98765 43210">
<label>Templates</label><div class="templates" id="templates"></div>
<p class="note">Template change karne par employee details automatically same rahengi.</p>
</div>
<div class="panel"><h2>Live Preview</h2><div class="stage"><div><div id="front" class="card portrait t1"></div><p style="text-align:center"><b>Front</b></p></div><div><div id="back" class="card portrait t1"></div><p style="text-align:center"><b>Back</b></p></div></div>
<div class="downloads"><button class="green" onclick="downloadCard('front','employee-id-front.png')">Download Front</button><button class="green" onclick="downloadCard('back','employee-id-back.png')">Download Back</button><button onclick="printCards()">Print Front + Back</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);let template=1,photo='',logo='';
const names=['Corporate Blue','Executive Gold','Maroon Pro','Clean Cyan','Dark Edge','Modern Gradient','Green Office','Black Gold','Soft Blue','Orange Accent'];
const box=$('templates');names.forEach((n,i)=>{let b=document.createElement('button');b.className='tpl'+(i===0?' active':'');b.textContent=(i+1)+'. '+n;b.onclick=()=>{template=i+1;document.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};box.appendChild(b)});
function fileData(inp,cb){let f=inp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
$('photoFile').onchange=()=>fileData($('photoFile'),x=>{photo=x;render()});$('logoFile').onchange=()=>fileData($('logoFile'),x=>{logo=x;render()});
document.querySelectorAll('input,select,textarea').forEach(e=>{if(!['file'].includes(e.type))e.addEventListener('input',render)});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 let o=$('orientation').value,c='card '+o+' t'+template;
 $('front').className=c;$('back').className=c;
 let nm=esc($('name').value),eid=esc($('empid').value),co=esc($('company').value),des=esc($('designation').value),dep=esc($('department').value),ph=esc($('phone').value),bl=esc($('blood').value),jn=esc($('joining').value),dob=esc($('dob').value),ad=esc($('address').value),em=esc($('emergency').value);
 $('front').innerHTML=`<div class="design"></div><div class="content">${logo?`<img class="logo" src="${logo}">`:''}<div class="company">${co}</div>${photo?`<img class="photo" src="${photo}">`:`<div class="photo"></div>`}<div class="empName">${nm}</div><div class="role">${des} • ${dep}</div><div class="details"><b>ID:</b> ${eid}<br><b>Phone:</b> ${ph}<br><b>Blood:</b> ${bl}<br><b>Joining:</b> ${jn}</div><canvas class="qr" id="qr"></canvas></div>`;
 $('back').innerHTML=`<div class="design"></div><div class="backcontent"><h3>${co}</h3><p><b>Employee:</b> ${nm}<br><b>Employee ID:</b> ${eid}<br><b>DOB:</b> ${dob}<br><b>Blood Group:</b> ${bl}<br><b>Emergency:</b> ${em}</p><p><b>Address</b><br>${ad}</p><p>This card is the property of ${co}. If found, please return it to the company.</p><div class="sign">Authorized Signature</div></div>`;
 setTimeout(()=>{let q=$('qr');if(q&&window.QRCode)QRCode.toCanvas(q,`Employee: ${nm}\\nID: ${eid}\\nCompany: ${co}\\nPhone: ${ph}`,{width:120,margin:1})},20)
}
async function downloadCard(id,name){let el=$(id);let canvas=await html2canvas(el,{scale:3,useCORS:true,backgroundColor:null});let a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function printCards(){window.print()}
render();
</script>
<style>@media print{header,.panel:first-child,.downloads,.panel>h2,.stage p{display:none!important}.grid{display:block}.panel{box-shadow:none;padding:0}.stage{display:flex!important;gap:10mm;transform:none!important}.card{transform:none!important;margin:0!important;box-shadow:none!important}}</style>
</body></html>
