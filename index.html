<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0 Cost Background Remover</title>
    <!-- यह लाइब्रेरी सीधे ब्राउज़र में AI रन करती है -->
    <script src="https://unpkg.com/@imgly/background-removal@1.4.3/dist/browser/background-removal.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f4f4f9;
        }
        #result { 
            max-width: 400px; 
            margin-top: 20px; 
            border: 2px dashed #ccc; 
            display: none; 
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYNgfQEhjw8T//x8YmBjgNJaRUIUoGkY1gNGAwWgYRjWA0YDBaBgmNgAAS3E+f+9+kZMAAAAASUVORK5CYII='); /* Transparent checkerboard bg */
        }
        .status { 
            color: #007bff; 
            font-weight: bold; 
            margin-top: 15px; 
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: none;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>Free AI Background Remover (Zero Server Cost)</h2>
    <p>यह पूरी तरह से आपके डिवाइस पर काम करता है!</p>

    <!-- फोटो अपलोड करने का बटन -->
    <input type="file" id="upload" accept="image/*">
    
    <div id="status" class="status"></div>
    <br>
    
    <!-- आउटपुट इमेज और डाउनलोड बटन -->
    <img id="result" alt="Result Image"><br>
    <a id="download-btn" class="btn" style="display: none;" download="no-bg.png">Download Photo</a>

    <script>
        const uploadInput = document.getElementById('upload');
        const statusText = document.getElementById('status');
        const resultImage = document.getElementById('result');
        const downloadBtn = document.getElementById('download-btn');

        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // 1. यूज़र को स्टेटस दिखाना
            statusText.innerText = "⏳ AI मॉडल लोड हो रहा है... (इसमें 10-15 सेकंड लग सकते हैं)";
            resultImage.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                // 2. Client-Side AI से बैकग्राउंड हटाना
                const imageBlob = await imglyRemoveBackground(file);
                
                // 3. बिना बैकग्राउंड वाली फोटो को स्क्रीन पर दिखाना
                const url = URL.createObjectURL(imageBlob);
                resultImage.src = url;
                resultImage.style.display = 'inline';
                
                // 4. डाउनलोड बटन सेट करना
                downloadBtn.href = url;
                downloadBtn.style.display = 'inline-block';

                statusText.innerText = "✅ बैकग्राउंड सफलतापूर्वक हटा दिया गया! (0 Cost)";
                
            } catch (error) {
                console.error(error);
                statusText.innerText = "❌ कुछ गलती हो गई। कृपया फिर से कोशिश करें।";
            }
        });
    </script>
</body>
</html>
