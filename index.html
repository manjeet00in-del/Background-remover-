<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PVC Cropper (0 Cost)</title>
    <!-- Cropper.js CSS & JS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Cropping Area */
        .crop-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .img-container {
            width: 100%;
            max-height: 400px;
            background-color: #eee;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .img-container img {
            max-width: 100%;
        }
        
        /* A4 Print Area */
        .print-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            background: white;
            border: 1px solid #ccc;
            padding-top: 20mm;
            position: relative;
            transform: scale(0.6);
            transform-origin: top center;
            margin-bottom: -100mm;
        }
        
        /* Standard PVC Size 85.6mm x 54mm */
        .pvc-card {
            width: 85.6mm;
            height: 54mm;
            border: 1px dashed #999;
            margin: 0 auto 10mm auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fdfdfd;
            overflow: hidden;
        }
        .pvc-card img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Ensure it fills the PVC size */
            display: none;
        }

        /* Buttons */
        .btn {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-upload { background: #3498db; }
        .btn-crop-f { background: #2ecc71; }
        .btn-crop-b { background: #f1c40f; color: black; }
        .btn-print { background: #e74c3c; font-size: 16px; margin-top: 20px;}

        /* Hide elements during print */
        @media print {
            body { background: white; padding: 0; }
            .crop-section, .btn-print { display: none !important; }
            .print-section { box-shadow: none; padding: 0; }
            .a4-sheet { 
                transform: scale(1); 
                border: none; 
                margin: 0; 
                padding-top: 15mm;
            }
            @page { margin: 0; size: A4 portrait; }
        }
    </style>
</head>
<body>

    <h2>🔥 Smart PVC Cropper Tool</h2>
    
    <div class="container">
        <!-- Left Side: Cropping Tool -->
        <div class="crop-section">
            <h3>1. Upload & Crop</h3>
            <input type="file" id="upload" accept="image/*" style="display: none;">
            <button class="btn btn-upload" onclick="document.getElementById('upload').click()">📁 Select Image (Aadhaar/PAN)</button>
            
            <div class="img-container">
                <img id="image" src="">
            </div>
            
            <div>
                <button class="btn btn-crop-f" onclick="cropImage('front')">✂️ Set as Front</button>
                <button class="btn btn-crop-b" onclick="cropImage('back')">✂️ Set as Back</button>
            </div>
            <p style="font-size: 13px; color: #666; mt-2">बॉक्स को खिसकाएं और बटन दबाएं।</p>
        </div>

        <!-- Right Side: A4 Preview & Print -->
        <div class="print-section">
            <h3>2. A4 Print Preview</h3>
            <div class="a4-sheet" id="print-area">
                <!-- Front Card Slot -->
                <div class="pvc-card" id="slot-front">
                    <span id="text-front">Front Side</span>
                    <img id="img-front" src="">
                </div>
                <!-- Back Card Slot -->
                <div class="pvc-card" id="slot-back">
                    <span id="text-back">Back Side</span>
                    <img id="img-back" src="">
                </div>
            </div>
            <button class="btn btn-print" onclick="window.print()">🖨️ Print A4 Sheet</button>
        </div>
    </div>

    <script>
        let cropper;
        const image = document.getElementById('image');
        const uploadInput = document.getElementById('upload');

        // जब फोटो अपलोड हो
        uploadInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const url = URL.createObjectURL(file);
                image.src = url;

                // पुरानी क्रॉपिंग डिलीट करें (अगर कोई हो)
                if (cropper) {
                    cropper.destroy();
                }

                // Cropper.js चालू करें
                cropper = new Cropper(image, {
                    aspectRatio: 85.6 / 54, // PVC Card Ratio (85.6mm x 54mm)
                    viewMode: 1, // फोटो को बॉक्स के अंदर रखता है
                    autoCropArea: 0.8,
                });
            }
        });

        // क्रॉप बटन का फंक्शन
        function cropImage(side) {
            if (!cropper) {
                alert("Please upload an image first!");
                return;
            }

            // क्रॉप्ड हिस्से को हाई-क्वालिटी कैनवास में बदलना
            const canvas = cropper.getCroppedCanvas({
                width: 1011, // High resolution (300 DPI approx for 85.6mm)
                height: 638,
            });

            // इमेज को सेट करना
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            
            if (side === 'front') {
                document.getElementById('img-front').src = dataUrl;
                document.getElementById('img-front').style.display = 'block';
                document.getElementById('text-front').style.display = 'none';
            } else if (side === 'back') {
                document.getElementById('img-back').src = dataUrl;
                document.getElementById('img-back').style.display = 'block';
                document.getElementById('text-back').style.display = 'none';
            }
        }
    </script>

</body>
</html>
